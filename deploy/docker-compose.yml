# Despliegue del Módulo de Salud: MySQL + backend (gunicorn) + frontend (nginx).
#
# Estructura esperada en el servidor (los tres repos, uno al lado del otro):
#   ~/salud/SALUD-BACKEND     <- este repo (aquí está deploy/)
#   ~/salud/SALUD-FRONTEND
#   ~/salud/SALUD-DATABASE
#
# Uso (desde SALUD-BACKEND/deploy):
#   cp .env.example .env      # y completar los valores
#   docker compose up -d --build
#
# Solo el frontend se publica, y únicamente en 127.0.0.1: el túnel de Cloudflare
# (cloudflared en el servidor) lo expone como https://saludumg.online.
# MySQL y el backend NO quedan accesibles desde fuera.

name: salud

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: salud_db
      MYSQL_USER: salud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      TZ: America/Guatemala
    volumes:
      - salud_mysql:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez (con el volumen vacío)
      - ../../SALUD-DATABASE/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../SALUD-DATABASE/datos insertados.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
      # Datos ficticios para la presentación (pacientes, citas, expedientes...)
      - ../../SALUD-DATABASE/datos_demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - ../../SALUD-DATABASE/demo_turnos_hoy.sql:/docker-entrypoint-initdb.d/04-turnos-hoy.sql:ro
      # Montado también fuera del init para poder recargar los turnos otro día:
      #   docker compose exec db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < /demo/demo_turnos_hoy.sql'
      - ../../SALUD-DATABASE/demo_turnos_hoy.sql:/demo/demo_turnos_hoy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://salud:${MYSQL_PASSWORD}@db:3306/salud_db
      AUTH_ISSUER: ${AUTH_ISSUER:?Falta AUTH_ISSUER en .env}
      AUTH_AUDIENCE: rsd-api
      MODULOS_API_KEY: ${MODULOS_API_KEY:?Falta MODULOS_API_KEY en .env}
      # Mientras los otros módulos no publiquen su servicio, se usan los
      # simuladores (servicio de abajo). Cuando un equipo tenga su URL real,
      # se pone en el .env y se corre "docker compose up -d".
      URL_EDUCACION: ${URL_EDUCACION:-http://simuladores:5055}
      URL_SEGURIDAD: ${URL_SEGURIDAD:-http://simuladores:5055}
      URL_TRIBUTARIO: ${URL_TRIBUTARIO:-http://simuladores:5055}
      API_KEY_EDUCACION: ${API_KEY_EDUCACION:-}
      API_KEY_SEGURIDAD: ${API_KEY_SEGURIDAD:-}
      API_KEY_TRIBUTARIO: ${API_KEY_TRIBUTARIO:-}
      REENVIAR_TOKEN_USUARIO: ${REENVIAR_TOKEN_USUARIO:-true}
      # Clave que Salud entrega a cada módulo para que nos consuma (una por grupo)
      CLAVE_ENTRADA_SEGURIDAD: ${CLAVE_ENTRADA_SEGURIDAD:-}
      CLAVE_ENTRADA_EDUCACION: ${CLAVE_ENTRADA_EDUCACION:-}
      CLAVE_ENTRADA_TRIBUTARIO: ${CLAVE_ENTRADA_TRIBUTARIO:-}
      CLAVE_ENTRADA_AUDITORIA: ${CLAVE_ENTRADA_AUDITORIA:-}
      DEPARTAMENTO_ALERTAS: ${DEPARTAMENTO_ALERTAS:-Sacatepéquez}
      DIAS_VENCIMIENTO_COBRO: ${DIAS_VENCIMIENTO_COBRO:-15}
      COSTO_CONSULTA: ${COSTO_CONSULTA:-150}
      TZ: America/Guatemala

  # Simuladores de Educación, Seguridad y Tributario (datos ficticios; todas
  # las respuestas dicen "simulado": true). Solo en la red interna de Docker:
  # no se publican a internet.
  simuladores:
    build: ..
    restart: unless-stopped
    command: ["gunicorn", "--workers", "1", "--threads", "4", "--bind", "0.0.0.0:5055",
              "--chdir", "simuladores", "--access-logfile", "-", "app:app"]
    environment:
      MODULOS_API_KEY: ${MODULOS_API_KEY}
      SALUD_URL: http://backend:5050
      TZ: America/Guatemala

  frontend:
    build: ../../SALUD-FRONTEND
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Se inyectan al arrancar (config.js): cambiar la URL del día solo
      # requiere "docker compose up -d", no recompilar.
      AUTH_URL: ${AUTH_ISSUER}
      CLIENT_ID: salud-web
    ports:
      - "127.0.0.1:${PUERTO_WEB:-8080}:80"

volumes:
  salud_mysql:
